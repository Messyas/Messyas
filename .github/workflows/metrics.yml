name: GitHub Metrics & Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "assets/**"
      - "profile-3d-contrib/**"
      - "README.md"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards do perfil
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-language-cards.mjs

      - name: Salvar cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-languages-dark.svg assets/github-languages-light.svg assets/github-stats-dark.svg assets/github-stats-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar cards do perfil [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main && git push && break || sleep 3
            done
          fi
