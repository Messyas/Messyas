name: GitHub Metrics & Stats

on:
  schedule:
    - cron: "0 6 * * *" # Executa automaticamente todos os dias às 06:00 UTC
  workflow_dispatch: # Permite executar manualmente pela aba Actions
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Métricas & Top Linguagens
        uses: lowlighter/metrics@latest
        with:
          # Utiliza o token nativo e seguro do GitHub Actions (não expõe credenciais externas)
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Manaus
          
          # Destino do SVG gerado
          output_action: commit
          committer_message: "chore: atualizar estatísticas do perfil [skip ci]"
          filename: assets/github-metrics.svg

          # Configuração de Linguagens
          plugin_languages: yes
          plugin_languages_ignored: >-
            jupyter notebook, html, css, tex, less, scss, markdown
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
