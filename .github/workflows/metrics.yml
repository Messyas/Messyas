name: GitHub Metrics & Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards de linguagens
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-language-cards.mjs

      - name: Salvar cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-languages-dark.svg assets/github-languages-light.svg
          git diff --cached --quiet || git commit -m "chore: atualizar linguagens do perfil [skip ci]"
          git push
