name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "profile-3d-contrib/**"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Limpar graficos redundantes do SVG
        run: node scripts/clean-3d-contrib.mjs

      - name: Salvar gráfico 3D gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualizar 3d contrib [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main && git push && break || sleep 3
            done
          fi
